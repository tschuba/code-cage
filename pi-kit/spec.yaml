schemaVersion: "1"
kind: agent
name: pi
displayName: Pi
description: "Minimal terminal coding agent with extensible tools, skills, and TUI"

agent:
  image: "docker/sandbox-templates:shell-docker"
  aiFilename: AGENTS.md
  entrypoint:
    run: [pi]

network:
  allowedDomains:
    - registry.npmjs.org
    - api.anthropic.com
    - console.anthropic.com
    - claude.ai

commands:
  install:
    - command: "npm config set proxy $HTTP_PROXY && npm config set https-proxy $HTTP_PROXY && i=0; while [ $i -lt 5 ]; do npm install -g --maxsockets=1 --fetch-timeout=600000 @earendil-works/pi-coding-agent && break; i=$((i+1)); echo \"Retrying ($i/5)...\"; done"
      user: "1000"
      description: "Configure npm proxy and install pi coding agent globally (with retries)"
    - command: "apt-get update -qq && apt-get install -y -q fd-find || true"
      user: "0"
      description: "Install fd so pi skips the runtime download"
    - command: "SRC=$(ls -d /Users/*/.pi/agent 2>/dev/null | head -1); [ -n \"$SRC\" ] && mkdir -p /home/agent/.pi/agent && chown 1000:1000 /home/agent/.pi/agent && ln -sf \"$SRC/auth.json\" /home/agent/.pi/agent/auth.json || true"
      user: "0"
      description: "Symlink host pi auth into agent home"
