schemaVersion: "1"
kind: agent
name: pi
displayName: Pi
description: "Minimal terminal coding agent with extensible tools, skills, and TUI"

agent:
  image: "docker/sandbox-templates:shell-docker"
  aiFilename: AGENTS.md
  entrypoint:
    run: [pi]

network:
  allowedDomains:
    - registry.npmjs.org
    - api.anthropic.com
    - console.anthropic.com
    - claude.ai

commands:
  install:
    - command: "npm config set proxy $HTTP_PROXY && npm config set https-proxy $HTTP_PROXY && i=0; while [ $i -lt 5 ]; do npm install -g --maxsockets=1 --fetch-timeout=600000 @earendil-works/pi-coding-agent && break; i=$((i+1)); echo \"Retrying ($i/5)...\"; done"
      user: "1000"
      description: "Configure npm proxy and install pi coding agent globally (with retries)"
    - command: "apt-get update -qq && apt-get install -y -q fd-find || true"
      user: "0"
      description: "Install fd so pi skips the runtime download"
    - command: "SRC=$(ls -d /Users/*/.pi/agent 2>/dev/null | head -1); [ -n \"$SRC\" ] && mkdir -p /home/agent/.pi/agent && chown 1000:1000 /home/agent/.pi/agent && ln -sf \"$SRC/auth.json\" /home/agent/.pi/agent/auth.json; for d in skills npm; do [ -d \"$SRC/$d\" ] && ln -sf \"$SRC/$d\" /home/agent/.pi/agent/$d; done; SK=$(ls -d /Users/*/.pi/skills 2>/dev/null | head -1); [ -n \"$SK\" ] && ln -sf \"$SK\" /home/agent/.pi/skills; true"
      user: "0"
      description: "Symlink host pi auth, skills, npm packages, and user skills into agent home"
    - command: "HOST_CAGE=$(ls -d /Users/*/.cage 2>/dev/null | head -1); [ -n \"$HOST_CAGE\" ] && mkdir -p /home/agent/.cage && ln -sfn \"$HOST_CAGE/open\" /home/agent/.cage/open || true"
      user: "0"
      description: "Symlink host ~/.cage/open into agent home so open-host writes reach cage-opend"
    - command: "cat > /usr/local/bin/open-host << 'HEREDOC'\n#!/bin/sh\nn=\"${SANDBOX_VM_ID:-$(hostname)}\"\nt=\"$(date +%Y%m%d-%H%M%S)\"\nr=\"$HOME/.cage/open/${n}-${t}.json\"\npython3 -c \"import sys,json; print(json.dumps({'args':sys.argv[1:]}))\" \"$@\" > \"$r\"\ni=0\nwhile [ -f \"$r\" ] && [ $i -lt 20 ]; do sleep 0.1; i=$((i+1)); done\n[ $i -ge 20 ] && { rm -f \"$r\"; echo \"open-host: launch daemon unavailable\" >&2; exit 1; }\nexit 0\nHEREDOC\nchmod +x /usr/local/bin/open-host\nfor app in code:\"Visual Studio Code\" zed:Zed idea:\"IntelliJ IDEA\"; do\n  name=\"${app%%:*}\"; appname=\"${app#*:}\"\n  printf '#!/bin/sh\\nexec open-host -a \"%s\" \"${1:-.}\"\\n' \"$appname\" > \"/usr/local/bin/$name\"\n  chmod +x \"/usr/local/bin/$name\"\ndone"
      user: "0"
      description: "Install open-host wrapper and app shims (code, zed, idea) that open on the host via cage-opend"
