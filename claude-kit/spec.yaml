schemaVersion: "1"
kind: mixin
name: claude-kit
description: Links skills, plugins, rules and CLAUDE.md from host into agent home

network:
  allowedDomains:
    - github.com
    - api.github.com
    - objects.githubusercontent.com
    - codeload.github.com
    - raw.githubusercontent.com

commands:
  install:
    - command: "SRC=$(ls -d /Users/*/.claude 2>/dev/null | head -1); for d in skills plugins rules memory; do test -d \"$SRC/$d\" && ln -sfn \"$SRC/$d\" /home/agent/.claude/$d || true; done; ln -sf \"$SRC/CLAUDE.md\" /home/agent/.claude/CLAUDE.md || true"
      user: "0"
      description: "Symlink host skills, plugins, rules, CLAUDE.md into agent .claude"
    - command: "HOST_CAGE=$(ls -d /Users/*/.cage 2>/dev/null | head -1); [ -n \"$HOST_CAGE\" ] && mkdir -p /home/agent/.cage && ln -sfn \"$HOST_CAGE/open\" /home/agent/.cage/open || true"
      user: "0"
      description: "Symlink host ~/.cage/open into agent home so open-host writes reach cage-opend"
    - command: "cat > /usr/local/bin/open-host << 'HEREDOC'\n#!/bin/sh\nn=\"${SANDBOX_VM_ID:-$(hostname)}\"\nt=\"$(date +%Y%m%d-%H%M%S)\"\nr=\"$HOME/.cage/open/${n}-${t}.json\"\npython3 -c \"import sys,json; print(json.dumps({'args':sys.argv[1:]}))\" \"$@\" > \"$r\"\ni=0\nwhile [ -f \"$r\" ] && [ $i -lt 20 ]; do sleep 0.1; i=$((i+1)); done\n[ $i -ge 20 ] && { rm -f \"$r\"; echo \"open-host: launch daemon unavailable\" >&2; exit 1; }\nexit 0\nHEREDOC\nchmod +x /usr/local/bin/open-host\nfor app in code:\"Visual Studio Code\" zed:Zed idea:\"IntelliJ IDEA\"; do\n  name=\"${app%%:*}\"; appname=\"${app#*:}\"\n  printf '#!/bin/sh\\nexec open-host -a \"%s\" \"${1:-.}\"\\n' \"$appname\" > \"/usr/local/bin/$name\"\n  chmod +x \"/usr/local/bin/$name\"\ndone"
      user: "0"
      description: "Install open-host wrapper and app shims (code, zed, idea) that open on the host via cage-opend"
    - command: "HOST_CAGE=$(ls -d /Users/*/.cage 2>/dev/null | head -1); HTMPDIR=$(cat \"$HOST_CAGE/host-tmpdir/path\" 2>/dev/null | tr -d '\\n'); CAGE_TMPDIR=\"$HOST_CAGE/tmpdir\"; mkdir -p \"$CAGE_TMPDIR\"; printf 'export TMPDIR=%s\\n' \"$CAGE_TMPDIR\" >> /etc/sandbox-persistent.sh; [ -n \"$HTMPDIR\" ] && ln -sf \"$HTMPDIR/cage-clipboard.current\" \"$CAGE_TMPDIR/cage-clipboard.current\" || true"
      user: "0"
      description: "Set writable cage TMPDIR; symlink cage-clipboard.current from host tmpdir so clipboard reads still work"
    - command: "SRC=$(ls -d /Users/*/.claude 2>/dev/null | head -1); CAGE_PROJECTS=\"$(dirname \"$SRC\")/.cage/claude-projects\"; mkdir -p \"$CAGE_PROJECTS\" /home/agent/.claude/projects; cp -ru \"$CAGE_PROJECTS/.\" /home/agent/.claude/projects/ 2>/dev/null || true; setsid sh -c \"while true; do sleep 10; cp -ru /home/agent/.claude/projects/. ${CAGE_PROJECTS}/ 2>/dev/null; done\" </dev/null >/dev/null 2>&1 &"
      user: "0"
      description: "Seed cage session with prior history; background-sync new history back to host ~/.cage/claude-projects every 10s"
    - command: "git config --global credential.helper '!f() { echo username=x-access-token; echo password=$GH_TOKEN; }; f'"
      user: "1000"
      description: "Configure git HTTPS credential helper to use GH_TOKEN"
